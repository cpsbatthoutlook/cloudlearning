<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Bookmark</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Edit Bookmark</h1>
        <div class="card edit-bookmark-form">
            <form method="POST" action="{{ url_for('edit_bookmark', bookmark_id=bookmark.id) }}">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" value="{{ bookmark.title }}" required>

                <label for="url">URL:</label>
                <input type="url" id="url" name="url" value="{{ bookmark.url }}" required>

                <label for="category">Category:</label>
                <input type="text" id="category" name="category" value="{{ bookmark.category }}" required>

                <label for="description">Description (Optional):</label>
                <textarea id="description" name="description" rows="3">{{ bookmark.description }}</textarea>

                <button type="submit">Update Bookmark</button>
                <a href="{{ url_for('index') }}" class="button back-button">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
