<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>My Bookmarks</h1>

        <div class="card add-bookmark-form">
            <h2>Add New Bookmark</h2>
            <form method="POST" action="/">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>

                <label for="url">URL:</label>
                <input type="url" id="url" name="url" placeholder="https://example.com" required>

                <label for="category">Category:</label>
                <input type="text" id="category" name="category" required>

                <label for="description">Description (Optional):</label>
                <textarea id="description" name="description" rows="3"></textarea>

                <button type="submit">Add Bookmark</button>
            </form>
        </div>

        <div class="filter-section">
            <form method="GET" action="/">
                <label for="category_filter">Filter by Category:</label>
                <select id="category_filter" name="category" onchange="this.form.submit()">
                    <option value="All" {% if selected_category == 'All' or selected_category == None %}selected{% endif %}>All Categories</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if selected_category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </form>
        </div>

        {% if bookmarks %}
            <div class="bookmarks-list">
                <h2>Your Bookmarks</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for bookmark in bookmarks %}
                        <tr>
                            <td><a href="{{ bookmark.url }}" target="_blank">{{ bookmark.title }}</a></td>
                            <td>{{ bookmark.category }}</td>
                            <td>{{ bookmark.description }}</td>
                            <td class="actions">
                                <a href="{{ url_for('edit_bookmark', bookmark_id=bookmark.id) }}" class="button edit-button">Edit</a>
                                <form action="{{ url_for('delete_bookmark', bookmark_id=bookmark.id) }}" method="POST" style="display:inline;">
                                    <button type="submit" class="button delete-button" onclick="return confirm('Are you sure you want to delete this bookmark?');">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        {% else %}
            <p class="no-bookmarks">No bookmarks found. Add some above!</p>
        {% endif %}
    </div>
</body>
</html>
