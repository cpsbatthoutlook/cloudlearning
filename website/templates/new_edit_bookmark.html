{% extends 'base.html' %}

{% block title %}Edit Bookmark{% endblock %}

{% block content %}
    <h2>Edit Bookmark</h2>
    <form method="POST">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ bookmark.title }}" required>

        <label for="url">URL:</label>
        <input type="url" id="url" name="url" value="{{ bookmark.url }}" required>

        <label for="category">Category:</label>
        <select id="category" name="category" onchange="toggleNewCategoryField()">
            <option value="select_category">-- Select an existing category --</option>
            {% for category in categories %}
                <option value="{{ category.category }}" {% if bookmark.category == category.category %}selected{% endif %}>{{ category.category }}</option>
            {% endfor %}
            <option value="new_category_option">-- Add New Category --</option>
        </select>
        
        <div id="new_category_div" style="display:none;">
            <label for="new_category">New Category Name:</label>
            <input type="text" id="new_category" name="new_category">
        </div>

        <label for="description">Description (Optional):</label>
        <textarea id="description" name="description">{{ bookmark.description }}</textarea>

        <button type="submit">Update Bookmark</button>
    </form>

    <script>
        function toggleNewCategoryField() {
            var categorySelect = document.getElementById('category');
            var newCategoryDiv = document.getElementById('new_category_div');
            if (categorySelect.value === 'new_category_option') {
                newCategoryDiv.style.display = 'block';
            } else {
                newCategoryDiv.style.display = 'none';
            }
        }
    </script>
{% endblock %}
