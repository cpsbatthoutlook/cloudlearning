<!DOCTYPE html>
<html>
<head>
    <title>Modify Bookmark</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Modify Bookmark</h1>
    <p><a href="{{ url_for('index') }}">Back to Bookmarks</a></p>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label for="title">Title:</label><br>
        <input type="text" id="title" name="title" value="{{ bookmark.title }}" required><br><br>
        <label for="url">URL:</label><br>
        <input type="url" id="url" name="url" value="{{ bookmark.url }}" required><br><br>
        <label for="category_id">Category:</label><br>
        <select id="category_id" name="category_id" required>
            {% for category in categories %}
            <option value="{{ category.id }}" {% if category.id == bookmark.category_id %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
        </select><br><br>
        <input type="submit" value="Save Changes">
    </form>
</body>
</html>
